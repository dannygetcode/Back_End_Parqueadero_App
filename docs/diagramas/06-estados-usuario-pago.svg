<text x="50.0" y="527.0" font-family="'Liberation Serif','Times New Roman',Times,serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">Baja lógica (DELETE /api/usuarios/{id}): fija dado_de_baja_en, libera el cupo e inactiva el vehículo;</text>
<text x="50.0" y="545.0" font-family="'Liberation Serif','Times New Roman',Times,serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">el estado se conserva. El admin no puede poner ACTIVO a mano: para una cortesía registra un pago</text>
<text x="50.0" y="563.0" font-family="'Liberation Serif','Times New Roman',Times,serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">APROBADO con monto 0. Suspender, cambiar el PIN o dar de baja revoca los tokens emitidos.</text>
