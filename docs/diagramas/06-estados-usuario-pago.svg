<text x="910.0" y="488.0" font-family="'Liberation Serif','Times New Roman',Times,serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">Al aprobar se recalcula el periodo con la fecha de</text>
<text x="910.0" y="506.0" font-family="'Liberation Serif','Times New Roman',Times,serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">aprobación y el usuario pasa a ACTIVO si no está</text>
