name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Los tests de integracion (*IT) levantan su propio PostgreSQL 15 con Testcontainers (Docker ya esta en el
    # runner) y configuran sus propios valores de prueba: no hace falta Postgres de servicio ni secretos.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
