name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Los tests de integracion (*IT) levantan su propio PostgreSQL 15 con Testcontainers (Docker ya esta en el
    # runner) y configuran sus propios valores de prueba: no hace falta Postgres de servicio ni secretos.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  python:
    runs-on: ubuntu-latest
    # Pruebas de los servicios Python; no necesitan BD ni Docker.
    strategy:
      matrix:
        servicio: [pronostico, simulador]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.servicio }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.servicio }}
      - run: python -m pytest
        working-directory: ${{ matrix.servicio }}
