spring.application.name=parqueadero-backend

# Configuracion por variables de entorno. Ver .env.example (los valores reales van en .env, fuera de git).
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.upload.dir=${UPLOAD_DIR:uploads}
ocr.service.url=${OCR_SERVICE_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
jwt.secret=${JWT_SECRET}
