spring.application.name=parqueadero-backend

# Configuracion por variables de entorno. Ver .env.example (los valores reales van en .env, fuera de git).
# Por defecto solo escucha en local; en Docker (o para probar la app movil en la LAN) se pone SERVER_ADDRESS=0.0.0.0.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Base de datos. El esquema es de Flyway (ADR 0001): Hibernate solo valida.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Comprobantes (ADR 0005): fuera del repositorio; en Docker, el volumen "uploads".
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# OCR: si no responde en el timeout, el pago se crea con ocr_estado = FALLIDO.
ocr.service.url=${OCR_SERVICE_URL}
ocr.service.timeout=10s

# Seguridad (ADR 0003). JWT_SECRET >= 32 bytes; sin el, la aplicacion no arranca.
jwt.secret=${JWT_SECRET}
jwt.expiracion.admin=4h
jwt.expiracion.usuario=12h
# Solo se usan para crear el administrador inicial si la tabla esta vacia (se guarda el hash BCrypt).
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}
# Simulador de camara (rol SISTEMA, cabecera X-Api-Key). Sin valor, nadie se autentica con API key.
camara.api-key=${CAMARA_API_KEY:}
cors.origenes=${CORS_ORIGENES:http://localhost:5500,http://localhost:3000}
seguridad.pin.max-intentos=5
seguridad.pin.bloqueo-minutos=15
codigo-validacion.horas=72

# Estado del usuario (ADR 0006) y accesos (ADR 0004).
usuarios.vencimiento.dias-gracia=5
usuarios.vencimiento.cron=0 5 0 * * *
accesos.antirrebote-segundos=60
accesos.apertura-segundos=10
accesos.desfase-maximo-minutos=5

# Paginacion (RNF-15): size por defecto 20, maximo 100.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

legal.aviso-privacidad.version=2026-10
